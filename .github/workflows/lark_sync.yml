name: Lark → Supabase Project Sync

on:
  schedule:
    # Once a day at 23:00 UTC (06:00 Bangkok), on GitHub's cloud servers.
    # Was every 10 minutes - if GitHub ever ran that on time it would be
    # ~13,000 Lark API calls a month, more than the whole organisation's
    # 10,000/month allowance. Use "Run workflow" for an on-demand sync.
    - cron: "0 23 * * *"
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Run Lark sync
        env:
          LARK_APP_ID:             ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET:         ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN:     ${{ secrets.LARK_BASE_APP_TOKEN }}
          LARK_TABLE_ID:           ${{ secrets.LARK_TABLE_ID }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Field names in your Lark Base table (adjust if column names change):
          LARK_FIELD_NAME:     "Project"
          LARK_FIELD_CATEGORY: "Project Type"
          LARK_FIELD_STATUS:   "Status"
        run: python "BOQ to Warehouse/BOQ Converter App/tools/lark_sync.py"
